[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "trafficsync"
version = "1.0.0"
description = "TrafficSync - multi-agent traffic-signal control (AI3403, Group MadmaX)"
requires-python = ">=3.10"
readme = "README.md"
authors = [{name = "Group MadmaX (Abhijeet, Charan, Sumanth, Shreyansh, Tanush)"}]
dependencies = ["numpy>=1.24", "pyyaml>=6.0", "scipy>=1.10", "matplotlib>=3.7", "cvxpy>=1.4", "torch>=2.1"]

[project.optional-dependencies]
test = ["pytest>=7.0", "networkx>=3.0"]
sumo = ["eclipse-sumo>=1.20", "traci>=1.20", "sumolib>=1.20"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-ra"
markers = ["slow: longer integration tests (regression, MARL smoke)"]
